<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antonine Itineraries</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Georgia', serif; background: #1a1a2e; color: #e0d8c8; display: flex; flex-direction: column; height: 100vh; }
#header {
    padding: 10px 20px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
}
#header h1 { font-size: 1.3em; color: #e8d5b7; letter-spacing: 0.5px; }
#header p { font-size: 0.85em; color: #a89880; margin-top: 2px; }
#map { flex: 1; }
.leaflet-popup-content-wrapper {
    background: #16213e;
    color: #e8d5b7;
    border: 1px solid #0f3460;
    border-radius: 4px;
}
.leaflet-popup-tip { background: #16213e; }
.leaflet-popup-content { margin: 10px 14px; font-family: 'Georgia', serif; }
.leaflet-popup-content b { color: #e8d5b7; font-size: 0.95em; }
.leaflet-popup-content .sub { color: #a89880; font-size: 0.8em; margin-top: 4px; }
.leaflet-control-layers {
    background: rgba(22, 33, 62, 0.95) !important;
    border: 1px solid #0f3460 !important;
    color: #e8d5b7 !important;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
}
.leaflet-control-layers-base label,
.leaflet-control-layers-overlays label { color: #e8d5b7; font-size: 0.85em; }
.leaflet-control-layers-separator { border-top-color: #0f3460; }
.leaflet-bar a { background: #16213e; color: #e8d5b7; border-color: #0f3460; }
.leaflet-bar a:hover { background: #0f3460; }
.legend {
    background: rgba(22, 33, 62, 0.95);
    border: 1px solid #0f3460;
    border-radius: 4px;
    padding: 10px 14px;
    font-family: 'Georgia', serif;
    color: #e8d5b7;
    line-height: 1.6;
}
.legend h4 { margin: 0 0 6px; font-size: 0.9em; color: #e8d5b7; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8em; }
.legend-swatch { width: 24px; height: 3px; flex-shrink: 0; border-radius: 1px; }
.legend-dot { width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #e8d5b7; border: 1px solid #8b0000; }
</style>
</head>
<body>

<div id="header">
    <h1>Antonine Itineraries</h1>
    <p>Routes and waypoints of the <i>Itinerarium Antonini</i> — the principal road-book of the Roman Empire (3rd c. CE)</p>
</div>

<div id="map"></div>

<script>
// --- Colour palette (15 visually distinct hues) ---
const PALETTE = [
    '#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4',
    '#42d4f4', '#f032e6', '#a9c93e', '#fa8072', '#469990',
    '#b084cc', '#9A6324', '#e6c87a', '#c0392b', '#5dade2'
];

function colourFor(stretchId) {
    return PALETTE[Math.round(stretchId) % PALETTE.length];
}

// --- Five STRETCHID bands for toggle groups ---
const BANDS = [
    { label: 'Itineraries 1\u201350',    min: 0,   max: 49  },
    { label: 'Itineraries 51\u2013100',  min: 50,  max: 99  },
    { label: 'Itineraries 101\u2013150', min: 100, max: 149 },
    { label: 'Itineraries 151\u2013200', min: 150, max: 199 },
    { label: 'Itineraries 201\u2013252', min: 200, max: 299 }
];

const groups = BANDS.map(() => L.layerGroup());

function groupFor(stretchId) {
    for (let i = 0; i < BANDS.length; i++) {
        if (stretchId >= BANDS[i].min && stretchId <= BANDS[i].max) return groups[i];
    }
    return groups[groups.length - 1];
}

// --- Basemaps ---
const dare = L.tileLayer(
    'https://dh.gu.se/tiles/imperium/{z}/{x}/{y}.png',
    {
        attribution: '&copy; <a href="https://dh.gu.se/dare/">Johan \u00c5hlfeldt, CDH University of Gothenburg</a>',
        maxZoom: 11,
        minZoom: 3
    }
);

const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Imagery &copy; Esri, Maxar, GeoEye, Earthstar Geographics',
        maxZoom: 18
    }
);

// --- Map ---
const map = L.map('map', {
    center: [41, 20],
    zoom: 5,
    layers: [dare, ...groups]  // DARE + all route groups on by default
});

// --- Load route lines ---
let routesReady = false;

fetch('./data/antonine_itineraries.geojson')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
        data.features.forEach(feature => {
            const id = Math.round(feature.properties.STRETCHID || 0);
            const color = colourFor(id);
            const group = groupFor(id);

            const layer = L.geoJSON(feature, {
                style: { color, weight: 2.5, opacity: 0.85 }
            });

            layer.bindPopup(
                `<b>Stretch ${id}</b><div class="sub">Certainty: ${feature.properties.certainty || '\u2014'}</div>`
            );
            layer.addTo(group);

            // Direction arrow at midpoint — try/catch so a plugin error
            // doesn't abort forEach and hide the remaining routes
            layer.eachLayer(polyline => {
                L.polylineDecorator(polyline, {
                    patterns: [{
                        offset: '50%',
                        repeat: 0,
                        symbol: L.Symbol.arrowHead({
                            pixelSize: 9,
                            polygon: false,
                            pathOptions: { color, weight: 2, opacity: 0.95, fillOpacity: 0 }
                        })
                    }]
                }).addTo(group);
            });
        });

        routesReady = true;
        maybeAddLayerControl();
    })
    .catch(err => console.error('Failed to load routes:', err));

// --- Waypoint renderer ---
function waypointMarker(feature, latlng) {
    return L.circleMarker(latlng, {
        radius: 4,
        fillColor: '#e8d5b7',
        color: '#8b0000',
        weight: 1,
        opacity: 1,
        fillOpacity: 0.85
    });
}

function waypointPopup(feature) {
    const p = feature.properties;
    const name = p.label || '(unnamed)';
    const extra = [
        p.locsource ? `Location: ${p.locsource}` : null,
        p.TPID ? `TP ID: ${p.TPID}` : null
    ].filter(Boolean).join('<br>');
    return `<b>${name}</b>${extra ? `<div class="sub">${extra}</div>` : ''}`;
}

let waypointsLayer;
let waypointsReady = false;

fetch('./data/antonine_itineraries_points.geojson')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
        waypointsLayer = L.geoJSON(data, {
            pointToLayer: waypointMarker,
            onEachFeature: (feature, layer) => layer.bindPopup(waypointPopup(feature))
        }).addTo(map);
        waypointsReady = true;
        maybeAddLayerControl();
    })
    .catch(err => console.error('Failed to load waypoints:', err));

// --- Layer control ---
let layerControl = null;

function buildLayerControl() {
    const baseMaps = { 'Roman Empire (DARE)': dare, 'Satellite': satellite };
    const overlays = {};
    BANDS.forEach((band, i) => { overlays[band.label] = groups[i]; });
    if (waypointsLayer) overlays['Waypoints'] = waypointsLayer;
    layerControl = L.control.layers(baseMaps, overlays, { collapsed: false }).addTo(map);
}

function maybeAddLayerControl() {
    if (!routesReady && !waypointsReady) return;
    if (!layerControl) buildLayerControl();
    else if (waypointsReady && waypointsLayer) {
        layerControl.addOverlay(waypointsLayer, 'Waypoints');
    }
}

// --- Legend ---
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = '<h4>Legend</h4>';
    BANDS.forEach(band => {
        // Pick a representative colour from the middle of each band
        const mid = Math.floor((band.min + band.max) / 2);
        const c = colourFor(mid);
        div.innerHTML += `<div class="legend-item"><span class="legend-swatch" style="background:${c}"></span>${band.label}</div>`;
    });
    div.innerHTML += '<div class="legend-item"><span class="legend-dot"></span>Waypoint</div>';
    return div;
};
legend.addTo(map);
</script>
</body>
</html>
