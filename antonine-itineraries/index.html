<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antonine Itineraries & Bordeaux Itinerary</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Georgia', serif; background: #1a1a2e; color: #e0d8c8; display: flex; flex-direction: column; height: 100vh; }
#header {
    padding: 10px 20px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
}
#header h1 { font-size: 1.3em; color: #e8d5b7; letter-spacing: 0.5px; }
#header p { font-size: 0.85em; color: #a89880; margin-top: 2px; }
#map { flex: 1; }
.leaflet-popup-content-wrapper {
    background: #16213e;
    color: #e8d5b7;
    border: 1px solid #0f3460;
    border-radius: 4px;
}
.leaflet-popup-tip { background: #16213e; }
.leaflet-popup-content { margin: 10px 14px; font-family: 'Georgia', serif; }
.leaflet-popup-content b { color: #e8d5b7; font-size: 0.95em; }
.leaflet-popup-content .sub { color: #a89880; font-size: 0.8em; margin-top: 4px; }
.leaflet-control-layers {
    background: rgba(22, 33, 62, 0.95) !important;
    border: 1px solid #0f3460 !important;
    color: #e8d5b7 !important;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
}
.leaflet-control-layers-base label,
.leaflet-control-layers-overlays label { color: #e8d5b7; font-size: 0.85em; }
.leaflet-control-layers-separator { border-top-color: #0f3460; }
.leaflet-bar a { background: #16213e; color: #e8d5b7; border-color: #0f3460; }
.leaflet-bar a:hover { background: #0f3460; }
.legend {
    background: rgba(22, 33, 62, 0.95);
    border: 1px solid #0f3460;
    border-radius: 4px;
    padding: 10px 14px;
    font-family: 'Georgia', serif;
    color: #e8d5b7;
    line-height: 1.6;
}
.legend h4 { margin: 0 0 6px; font-size: 0.9em; color: #e8d5b7; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8em; }
.legend-swatch { width: 24px; height: 3px; flex-shrink: 0; border-radius: 1px; }
.legend-dot { width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #ffd700; border: 1px solid #8b6914; }
</style>
</head>
<body>

<div id="header">
    <h1>Antonine Itineraries & Bordeaux Itinerary</h1>
    <p>Routes of the <i>Itinerarium Antonini</i> and the <i>\Bordeaux Pilgrim</i></p>
</div>

<div id="map"></div>

<script>
// --- Colour palette (one per regional section) ---
const PALETTE = [
    '#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4',
    '#42d4f4', '#f032e6', '#a9c93e', '#fa8072'
];

// --- Regional sections based on the Antonine Itinerary text structure ---
const BANDS = [
    { label: '1. Africa',                     min: 0,   max: 33  },
    { label: '2. Insulae (Sard. Cors. Sic.)', min: 34,  max: 50  },
    { label: '3. Italia (southern)',           min: 51,  max: 63  },
    { label: '4. Oriens (Egypt, Asia Minor)',  min: 64,  max: 111 },
    { label: '5. Illyricum & Alps',            min: 112, max: 136 },
    { label: '6. Italia (Viae)',               min: 137, max: 161 },
    { label: '7. Gallia & Germania',           min: 162, max: 196 },
    { label: '8. Hispania',                    min: 197, max: 235 },
    { label: '9. Britannia',                   min: 236, max: 299 }
];

const groups = BANDS.map(() => L.layerGroup());

function groupFor(stretchId) {
    for (let i = 0; i < BANDS.length; i++) {
        if (stretchId >= BANDS[i].min && stretchId <= BANDS[i].max) return groups[i];
    }
    return groups[groups.length - 1];
}

function colourFor(stretchId) {
    for (let i = 0; i < BANDS.length; i++) {
        if (stretchId >= BANDS[i].min && stretchId <= BANDS[i].max) return PALETTE[i];
    }
    return PALETTE[PALETTE.length - 1];
}

// --- Basemaps ---
const dare = L.tileLayer(
    'https://dh.gu.se/tiles/imperium/{z}/{x}/{y}.png',
    {
        attribution: '&copy; <a href="https://dh.gu.se/dare/">Johan \u00c5hlfeldt, CDH University of Gothenburg</a>',
        maxZoom: 11,
        minZoom: 3,
        opacity: 0.5
    }
);

const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Imagery &copy; Esri, Maxar, GeoEye, Earthstar Geographics',
        maxZoom: 18
    }
);

// --- Map ---
const map = L.map('map', {
    center: [41, 20],
    zoom: 5,
    layers: [dare, ...groups]  // DARE + all route groups on by default
});

// Custom pane so Bordeaux markers render beneath route lines
map.createPane('bordeauxPane');
map.getPane('bordeauxPane').style.zIndex = 350;  // below overlayPane (400)

// --- Load route lines ---
let routesReady = false;

fetch('./data/antonine_itineraries.geojson')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
        data.features.forEach(feature => {
            const id = Math.round(feature.properties.STRETCHID || 0);
            const color = colourFor(id);
            const group = groupFor(id);

            const layer = L.geoJSON(feature, {
                style: { color, weight: 2.5, opacity: 0.85 }
            });

            layer.bindPopup(
                `<b>Stretch ${id}</b><div class="sub">Certainty: ${feature.properties.certainty || '\u2014'}</div>`
            );
            layer.addTo(group);

            // Direction arrow at midpoint — try/catch so a plugin error
            // doesn't abort forEach and hide the remaining routes
            layer.eachLayer(polyline => {
                L.polylineDecorator(polyline, {
                    patterns: [{
                        offset: '50%',
                        repeat: 0,
                        symbol: L.Symbol.arrowHead({
                            pixelSize: 9,
                            polygon: false,
                            pathOptions: { color, weight: 2, opacity: 0.95, fillOpacity: 0 }
                        })
                    }]
                }).addTo(group);
            });
        });

        routesReady = true;
        maybeAddLayerControl();
    })
    .catch(err => console.error('Failed to load routes:', err));

// --- Bordeaux Itinerary locations ---
let bordeauxLayer;
let bordeauxReady = false;

function bordeauxMarker(feature, latlng) {
    return L.circleMarker(latlng, {
        radius: 4,
        fillColor: '#ffd700',
        color: '#8b6914',
        weight: 1,
        opacity: 1,
        fillOpacity: 0.9,
        pane: 'bordeauxPane'
    });
}

function bordeauxPopup(feature) {
    const p = feature.properties;
    const name = p.name || '(unnamed)';
    const extra = [
        p.place_type ? `Type: ${p.place_type}` : null,
        p.vocab_label ? `${p.vocab_label.split('|')[0]}` : null
    ].filter(Boolean).join('<br>');
    return `<b>${name}</b>${extra ? `<div class="sub">${extra}</div>` : ''}`;
}

fetch('./data/bordeaux_itinerary.geojson')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
        bordeauxLayer = L.geoJSON(data, {
            pointToLayer: bordeauxMarker,
            onEachFeature: (feature, layer) => layer.bindPopup(bordeauxPopup(feature))
        }).addTo(map);
        bordeauxReady = true;
        maybeAddLayerControl();
    })
    .catch(err => console.error('Failed to load Bordeaux locations:', err));

// --- Layer control ---
let layerControl = null;

function buildLayerControl() {
    const baseMaps = { 'Roman Empire (DARE)': dare, 'Satellite': satellite };
    const overlays = {};
    BANDS.forEach((band, i) => { overlays[band.label] = groups[i]; });
    if (bordeauxLayer) overlays['Bordeaux Itinerary'] = bordeauxLayer;
    layerControl = L.control.layers(baseMaps, overlays, { collapsed: false }).addTo(map);
}

function maybeAddLayerControl() {
    if (!routesReady && !bordeauxReady) return;
    if (!layerControl) buildLayerControl();
    else if (bordeauxReady && bordeauxLayer) {
        layerControl.addOverlay(bordeauxLayer, 'Bordeaux Itinerary');
    }
}

// --- Legend ---
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = '<h4>Legend</h4>';
    BANDS.forEach((band, i) => {
        div.innerHTML += `<div class="legend-item"><span class="legend-swatch" style="background:${PALETTE[i]}"></span>${band.label}</div>`;
    });
    div.innerHTML += '<div class="legend-item"><span class="legend-dot"></span>Bordeaux Itinerary</div>';
    return div;
};
legend.addTo(map);
</script>
</body>
</html>
